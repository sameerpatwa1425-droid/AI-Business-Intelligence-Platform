<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Intelligence Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <h1>AI Business Intelligence Dashboard</h1>

    <!-- KPI Cards -->
    <div class="dashboard">

        <div class="card">
            <h2>Total Revenue</h2>
            <p id="revenue">Loading...</p>
        </div>

        <div class="card">
            <h2>Total Profit</h2>
            <p id="profit">Loading...</p>
        </div>

        <div class="card">
            <h2>Top Product</h2>
            <p id="topProduct">Loading...</p>
        </div>

        <div class="card">
            <h2>Top Category</h2>
            <p id="topCategory">Loading...</p>
        </div>

    </div>

    <!-- Monthly Revenue Chart -->
    <h2>Monthly Revenue Trend</h2>

    <canvas id="monthlySalesChart"></canvas>

    <!-- AI Insights -->
    <div class="insights-card">

        <h2>🤖 AI Business Insights</h2>

        <ul id="insightsList">

        </ul>

    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">

        <!-- Pie Chart -->
        <div class="chart-card">

            <h2>Revenue by Category</h2>

            <canvas id="categoryChart"></canvas>

        </div>

        <!-- Top Products Table -->
        <div class="table-card">

            <h2>Top Products</h2>

            <table id="topProductsTable">

                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Product</th>
                        <th>Revenue</th>
                    </tr>
                </thead>

                <tbody id="topProductsBody">
                </tbody>

            </table>

        </div>

    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Dashboard JS -->
    <script src="dashboard.js"></script>

</body>

</html>
